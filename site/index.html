<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111827" />
    <title>ETF 雷达</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>ETF 雷达</h1>
        <p id="generatedAt">等待数据</p>
      </div>
      <button id="refreshButton" type="button" aria-label="刷新">刷新</button>
    </header>

    <main>
      <section class="summary-grid" aria-label="市场摘要">
        <article class="metric">
          <span>市场状态</span>
          <strong id="regimeLabel">--</strong>
        </article>
        <article class="metric">
          <span>平均分</span>
          <strong id="averageScore">--</strong>
        </article>
        <article class="metric">
          <span>买入</span>
          <strong id="buyCount">--</strong>
        </article>
        <article class="metric">
          <span>卖出</span>
          <strong id="sellCount">--</strong>
        </article>
      </section>

      <nav class="tabs" aria-label="筛选">
        <button class="tab is-active" data-filter="all" type="button">全部</button>
        <button class="tab" data-filter="buy" type="button">买入</button>
        <button class="tab" data-filter="hold" type="button">持有</button>
        <button class="tab" data-filter="watch" type="button">观察</button>
        <button class="tab" data-filter="sell" type="button">卖出</button>
      </nav>

      <section class="panel portfolio-panel">
        <div class="panel-head">
          <h2>目标仓位</h2>
          <span>周度调仓</span>
        </div>
        <div id="portfolio" class="portfolio"></div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>ETF 信号</h2>
          <span id="signalCount">0</span>
        </div>
        <div id="signals" class="signals"></div>
      </section>
    </main>

    <script src="./app.js" type="module"></script>
  </body>
</html>
